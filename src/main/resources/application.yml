spring:
  application:
    name: jangbogo

  # Option 3: 별도 properties 파일 import
  config:
    import: optional:file:./config/admin.properties

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  thymeleaf:
    cache: false

  resources:
    cache:
      period: 0
    chain:
      cache: false

  datasource:
    url: jdbc:sqlite:./db/jangbogo-dev.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-init-sql: "PRAGMA foreign_keys=ON; PRAGMA journal_mode=WAL;"

  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8

server:
  port: 8282
  address: 127.0.0.1  # localhost에서만 접근 가능

# Admin 설정 (Option 1: 환경변수 사용)
# 환경변수가 없으면 기본값 사용
admin:
  id: ${ADMIN_ID:admin_main}
  pass: ${ADMIN_PASS:admin1234_main}

# 사용자 정의 설정 (Custom Configuration)
jangbogo:
  # 기동 시 수집 동작. StartupTasks 의 코드 기본값은 false 이며 여기서 명시적으로 켠다.
  # 끄면 1회 수집과 스케줄 복원을 건너뛴다 (DB 스키마 마이그레이션은 계속 수행).
  startup:
    collect:
      enabled: true

  # 세션 프로필 재사용 마스터 킬스위치. 기본은 꺼짐이고, 명시적으로 true 라야 켜진다.
  #
  # 켜면 수집 경로가 통째로 바뀐다 — 로그인 화면을 밟지 않고 사람이 한 번 로그인해 둔
  # 브라우저 프로필로 창을 띄우며, 프로필 락과 소유자 검사가 붙는다. 그중 하나라도
  # 어긋나면 수집이 실패가 아니라 '멈춘 채 타임아웃' 으로 나타난다. 그래서 되돌리는
  # 수단(이 값을 false 로) 을 먼저 확보해 둔다.
  #
  # 이 스위치 하나만으로는 아무 것도 바뀌지 않는다. 게이트가 둘이다 — 여기를 true 로 두고
  # 그 몰의 옵트인(jbg_mall.session_profile_enabled)까지 켜야 비로소 그 몰의 수집이 세션 주입
  # 경로로 갈린다. 그 경로는 로그인 폼을 제출하지 않고, 사람이 '브라우저로 로그인' 으로 떠 둔
  # 세션을 주입해서 돈다. 세션이 없거나 만료면 수집이 실패가 아니라 '건너뜀' 으로 기록된다.
  # 둘 중 하나만 켜면 예전 경로 그대로다 (되돌릴 때도 여기 하나만 false 로 하면 전부 되돌아간다).
  #
  # 이 값을 실제로 읽는 SessionProfilePolicy 는 System.getProperty 로만 본다.
  # 여기 적은 값은 SessionProfilePropertyBridge 가 기동 시(컨텍스트 생성 전) 옮겨 준다.
  # 명령줄 -D 로 준 값이 있으면 그쪽이 이긴다.
  #
  # 배포본에서는 이 파일이 JAR 안에 있으므로 고칠 수 없다. 설치 폴더의
  # config/application.yml 에 같은 블록을 적으면 그 값이 이긴다 (고급가이드.txt 참조).
  session-profile:
    enabled: false
    # 프로필 루트 재정의. 비워 두면 %LOCALAPPDATA%\Jangbogo\profiles 를 쓴다.
    # 설치 폴더 아래로는 두지 마라 — 재설치 때 통째로 갈리고, 개발 환경에서는
    # 저장소 트리 안이라 로그인 세션이 커밋될 수 있다.
    # root:

  config:
    localdb-name: jangbogo-dev
    localdb-path: ./db
    max-retry-count: 3
    timeout-seconds: 30
    debug-mode: true
    app-version: 1.0.0
    mall_signin_delay: 21600000
    default_web_driver: chrome # chrome, edge
    browser_headless: false
