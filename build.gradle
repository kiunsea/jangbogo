plugins {
	id 'java'
	id 'application'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.9.0'
}

group = 'com.jiniebox'
version = '0.18.4'
description = '사용자 온라인/오프라인 구매 내역 수집기'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = '21'
	targetCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// Selenium 버전 고정 (Spring Boot 의존성 관리가 사용하는 프로퍼티)
// 모든 selenium-* 모듈이 이 버전으로 함께 해석되도록 한 곳에서만 지정한다.
// 주의: typed DevTools(org.seleniumhq.selenium:selenium-devtools-vNNN)는 이 버전에 맞는 아티팩트가
// 있어야 쓸 수 있다. Chrome 150 용 v150 아티팩트는 존재하지 않으므로 CDP 는 typed API 가 아니라
// ChromiumDriver.executeCdpCommand(...) 로 호출해야 한다. (기동 시 뜨는 "Unable to find CDP
// implementation matching NNN" 경고는 typed API 부재를 알릴 뿐, executeCdpCommand 동작과 무관하다)
ext['selenium.version'] = '4.31.0'

repositories {
	mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.2.1'

	// Spring Boot Starters - Logback 제외하고 Log4j2 사용
	implementation('org.springframework.boot:spring-boot-starter-thymeleaf') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
	implementation('org.springframework.boot:spring-boot-starter') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
	implementation('org.springframework.boot:spring-boot-starter-web') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
	implementation('org.springframework.boot:spring-boot-starter-jdbc') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
	
	// Log4j2 추가
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
	
	implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
	
	// Selenium WebDriver (selenium-java에 모든 드라이버 포함)
	// 버전은 위 ext['selenium.version'] 으로 고정한다. 여기에 버전을 직접 쓰면 selenium-java(집합 POM)만
	// 그 버전이 되고 실제 모듈(api/remote-driver/chromium-driver 등)은 Spring Boot 관리 버전으로 해석돼
	// 선언과 실제가 어긋난다.
	implementation 'org.seleniumhq.selenium:selenium-java'
	
	// JSON Simple
	implementation 'com.googlecode.json-simple:json-simple:1.1.1'
	
	// Jackson YAML (YAML 파일 읽기/쓰기)
	// 버전을 직접 쓰지 않는다. Spring Boot 의존성 관리가 jackson-core/databind 를 해석하는 버전과
	// 반드시 같아야 한다 — jackson 은 모듈 버전 일치를 전제한다. 과거 여기에 2.15.3 을 못박아
	// databind(2.19.2)와 4개 마이너가 어긋나 있었다. YamlMapperCompatibilityTest 가 이를 감시한다.
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
	
	// Apache Commons Net (FTP/FTPS 클라이언트)
	implementation 'commons-net:commons-net:3.11.1'
	
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}

	// Playwright 의존성은 두지 않는다.
	//
	// T3 판정의 배제 절차로 한 번 넣어 실제로 재 봤고(PW-2 프로필 재사용 실패 / PW-3 세션 주입
	// 성공), 유효한 방식이 기존 스택으로 되는 것을 확인해 판정이 끝났다. 근거가 사라졌으므로
	// 제거한다 — 계획서 수용 기준 5("main 의 build.gradle 에 Playwright 의존성이 없다")를 지킨다.
	// 측정 기록은 doc/developer/adr/ADR-0001 에 있고, 프로브는 커밋 6f59357 에 남아 있다.

	// JUnit 5 명시적 추가 (IDE 호환성)
	testImplementation 'org.junit.jupiter:junit-jupiter-api'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	developmentOnly('org.springframework.boot:spring-boot-devtools') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

tasks.named('test') {
	// 프로브(@Tag("probe"))는 실제 브라우저를 띄우고 사람의 조작을 기다린다.
	// 일반 테스트 묶음은 브라우저·네트워크·DB 없이 돌아야 하므로 기본적으로 제외한다.
	// 실행하려면: ./gradlew test -PincludeProbe --tests '*Probe*'
	useJUnitPlatform {
		if (!project.hasProperty('includeProbe')) {
			excludeTags 'probe'
		}
	}

	// LocalDBConnection 은 Spring DataSource 를 거치지 않고 직접 JDBC 로 접속하므로
	// src/test/resources/application.yml 의 spring.datasource.url 이 적용되지 않는다.
	// 오버라이드하지 않으면 테스트가 기준선 DB(./db/jangbogo-dev.db)를 그대로 열고 DDL 을 실행한다.
	def testDbDir = layout.buildDirectory.dir('test-db').get().asFile
	doFirst { testDbDir.mkdirs() }
	def testDbFile = new File(testDbDir, 'jangbogo-test.db').absolutePath.replace('\\', '/')
	systemProperty 'jangbogo.localdb.url', "jdbc:sqlite:${testDbFile}"

	// 프로브 대상 지정을 테스트 JVM 까지 넘긴다.
	//
	// gradle 명령줄의 -D 는 gradle JVM 에만 붙고 포크된 테스트 JVM 은 상속하지 않는다.
	// 넘기지 않으면 프로브가 그 값을 못 보고 조용히 다른 대상으로 돈다 — 실제로
	// oasis 를 지정했는데 ssg 브라우저가 떴고, 기록까지 덮어썼다.
	['jangbogo.probe.mall'].each { key ->
		def value = System.getProperty(key)
		if (value != null) {
			systemProperty key, value
		}
	}

	// ScreenshotUtil 은 기본적으로 작업 디렉터리의 logs/screenshots 에 PNG 를 쓴다.
	// 테스트가 개발 트리에 파일을 남기지 않도록 build/ 아래로 격리한다. (Phase 3-7)
	def screenshotDir = layout.buildDirectory.dir('test-screenshots').get().asFile
	doFirst { screenshotDir.mkdirs() }
	systemProperty 'jangbogo.screenshot.dir', screenshotDir.absolutePath.replace('\\', '/')

	// 소스 트리의 배치 스크립트와 빌드 스크립트를 test 의 입력으로 선언한다.
	//
	// BuildScriptHygieneTest·DistributionHygieneTest·RepositoryHygieneTest 는 자바 소스가 아니라
	// 이 파일들을 읽는다. 입력으로 선언하지 않으면 캐시 키에 안 들어가서, .bat 을 고치고
	// gradlew test 를 돌려도 UP-TO-DATE 로 넘어가 검사가 아예 실행되지 않는다.
	//
	// 실측으로 확인한 사고다: BuildScriptHygieneTest 를 넣은 직후 test_run.bat 에 일부러
	// rmdir /s /q build 를 넣고 돌렸는데 초록이 나왔다. --rerun-tasks 로 다시 돌리자 그제서야
	// 빨개졌다. "가드는 살아 있는데 돌지 않아서 초록" — 이 저장소가 반복해서 겪은 형태다.
	//
	// 아래 build/distributions 건과 달리 이쪽은 안전하다. bat/·packaging/ 은 사람이 쓰는 소스
	// 디렉터리이고 어떤 태스크의 출력도 아니라서 암묵적 의존이 생기지 않는다.
	inputs.files(fileTree('bat') { include '**/*.bat' }).withPropertyName('batchScripts')
	inputs.files(fileTree('packaging') { include '**/*.bat', '**/*.xml' })
		.withPropertyName('packagingScripts')
	inputs.file('build.gradle').withPropertyName('buildScript')
	inputs.file('.gitignore').withPropertyName('gitignoreRules')

	// build/distributions 를 test 의 입력으로 선언하지 않는다 — 시도했다가 되돌렸다.
	//
	// 동기는 옳았다: DistributionHygieneTest 의 실물 ZIP 검사가 그 디렉터리를 읽는데 입력으로
	// 선언돼 있지 않아 캐시 키에 안 들어간다. 그래서 ZIP 이 없던 시점의 결과가 FROM-CACHE 로
	// 복원되면 새 ZIP 이 생긴 뒤에도 그 층은 '스킵' 인 채 초록이다.
	//
	// 그런데 선언하는 순간 test 가 distZip·bootDistZip·distTar·bootDistTar 의 출력을 읽는
	// 셈이 되어 Gradle 이 암묵적 의존으로 build 를 실패시킨다(실측). 의존을 명시하면 이번엔
	// 단위 테스트가 배포 아카이브 생성을 기다리게 되어 test 의 성격이 바뀐다.
	//
	// 그래서 캐시 구멍은 남겨 두되, 그 층에 기대지 않는다. 배포물에 개인 데이터가 실리는 것을
	// 실제로 막는 것은 packageDist 자신의 산출물 검사다 — 그것은 아카이브를 만드는 태스크
	// 안에서 돌므로 아카이브가 새로 만들어졌는데 검사만 건너뛰는 상태가 될 수 없다.
	// DistributionHygieneTest 의 실물 층은 그 위에 얹은 편의 검사로만 본다.
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.17.0')
	}
}

// clean 이 사용자 데이터를 지우지 못하게 막는다.
//
// 왜 필요한가: clean 은 build/ 를 통째로 지운다. 그런데 이 프로젝트는 배포 패키지를
// build/distributions/ 아래에 풀어서 그 자리에서 실행하는 관행이 있고, 그렇게 실행된
// 인스턴스는 자기 db/ 를 그 안에 만든다. 즉 build/ 아래에 "빌드 산출물" 과 "그 인스턴스가
// 수집한 실제 구매 내역" 이 섞여 있다.
//
// 가정이 아니다 — 실제로 clean 한 번에 배포본 인스턴스와 그 DB 가 통째로 사라진 적이 있다.
// 복구 수단이 없다: Gradle 의 delete 는 휴지통을 거치지 않는다.
//
// "clean 을 쓰지 마라" 는 규칙으로 막고 있었지만 규칙은 잊힌다. clean 을 호출하는 경로가
// 스크립트 3개(clean_build·build_package·test_run)에 직접 실행까지 있어 호출부마다 고치면
// 반드시 빠지는 자리가 생긴다. 그래서 태스크 자체에 건다.
//
// 막는 대상은 앱의 DB 파일 하나로 좁혔다. 빌드가 만드는 test-db 는 지워도 되고, Chrome
// 프로필 캐시의 .db 까지 잡으면 오탐이 잦아 가드가 무시당한다. 정말로 지워야 할 때는
// -Pallow-clean-user-data 로 의도를 밝힌다.
tasks.named('clean') {
	doFirst {
		def buildDirFile = layout.buildDirectory.get().asFile
		if (!buildDirFile.exists() || project.hasProperty('allow-clean-user-data')) {
			return
		}
		def testDbPath = new File(buildDirFile, 'test-db').canonicalPath
		def victims = []
		buildDirFile.eachFileRecurse(groovy.io.FileType.FILES) { f ->
			def name = f.name.toLowerCase(Locale.ROOT)
			if (name.startsWith('jangbogo') && (name.contains('.db'))) {
				if (!f.canonicalPath.startsWith(testDbPath)) {
					victims << f.absolutePath
				}
			}
		}
		if (!victims.isEmpty()) {
			throw new GradleException(
				"clean 을 멈췄다 — build/ 아래에 앱 DB 가 있다. 지우면 그 인스턴스가 수집한 구매 내역이\n" +
				"사라지고 되돌릴 수 없다(휴지통을 거치지 않는다).\n\n" +
				victims.collect { "  - ${it}" }.join("\n") + "\n\n" +
				"보통은 배포 패키지를 build/distributions 아래에 풀어서 그 자리에서 실행했을 때 생긴다.\n" +
				"권장: 그 폴더를 저장소 밖(예: D:\\Jangbogo)으로 옮기고 거기서 실행해라. 그러면 clean 이\n" +
				"무해해지고 배포 환경과도 같아진다.\n\n" +
				"재빌드만 원한다면 clean 없이 하면 된다:  ./gradlew bootJar createJre packageDist\n" +
				"정말로 지워도 된다면:  ./gradlew clean -Pallow-clean-user-data")
		}
	}
}

// Spring Boot JAR 설정: plain JAR 생성 안 함
jar {
	enabled = false
}

bootJar {
	enabled = true
}

application {
	mainClass = 'com.jiniebox.jangbogo.JangbogoLauncher'
	applicationName = 'jangbogo'
}

// Custom JRE 생성 태스크 (jlink 사용)
tasks.register('createJre') {
	def jreDir = file("${buildDir}/jre")
	
	outputs.dir(jreDir)
	
	doFirst {
		// 기존 JRE 강제 삭제
		if (jreDir.exists()) {
			println "기존 JRE 디렉토리 삭제 중..."
			jreDir.deleteDir()
		}
	}
	
	doLast {
		// jlink로 custom JRE 생성
		exec {
			commandLine 'jlink',
				'--add-modules', 'java.base,java.compiler,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.httpserver,jdk.jdwp.agent,jdk.jfr,jdk.management,jdk.management.agent,jdk.naming.dns,jdk.net,jdk.security.auth,jdk.unsupported,jdk.zipfs',
				'--strip-debug',
				'--no-man-pages',
				'--no-header-files',
				'--compress=2',
				'--output', jreDir.absolutePath
		}
		println "✓ Custom JRE 생성 완료: ${jreDir.absolutePath}"
		println "  포함된 모듈: Spring Boot 및 Tomcat 구동에 필요한 모든 모듈"
	}
}

// 번들 JRE 의 실제 버전을 읽어 대응 소스 안내문을 만든다 (AGPL/GPLv2 대응).
//
// 왜 별도 태스크인가: 버전은 jlink 가 만든 build/jre/release 안에 있고 그 파일은 createJre 가
// 실행돼야 생긴다. packageDist 의 ReplaceTokens 는 토큰 맵을 설정 시점에 굳히므로 그 값을
// 넣을 수 없다. CI 는 setup-java 가 주는 JDK 로 빌드하므로 로컬과 버전이 다를 수 있고,
// 그래서 숫자를 손으로 적어 두면 반드시 어긋난다.
tasks.register('generateSourceNotice') {
	dependsOn createJre

	def template = file('packaging/distribution/CORRESPONDING-SOURCE.txt')
	def releaseFile = file("${buildDir}/jre/release")
	def outputFile = file("${buildDir}/generated/CORRESPONDING-SOURCE.txt")

	inputs.file(template)
	inputs.file(releaseFile)
	outputs.file(outputFile)

	doLast {
		// release 파일 예: JAVA_VERSION="21.0.11"
		def javaVersion = releaseFile.readLines()
			.findResult { line ->
				def m = line =~ /^JAVA_VERSION="?([^"]+)"?$/
				m ? m[0][1] : null
			}
		if (!javaVersion) {
			throw new GradleException(
				"${releaseFile} 에서 JAVA_VERSION 을 읽지 못했다. 번들 JRE 의 소스 안내가 틀린 채로 배포된다.")
		}

		outputFile.parentFile.mkdirs()
		outputFile.text = template.getText('UTF-8')
			.replace('@APP_VERSION@', project.version.toString())
			.replace('@JAVA_VERSION@', javaVersion)
		println "✓ 대응 소스 안내 생성: app=${project.version}, jre=${javaVersion}"
	}
}

// 배포 패키지 생성 태스크: JAR + 배치 스크립트 + Custom JRE + WinSW
tasks.register('packageDist', Zip) {
	dependsOn bootJar, createJre, generateSourceNotice
	
	archiveFileName = 'Jangbogo-distribution.zip'
	destinationDirectory = file("${buildDir}/distributions")
	
	from(bootJar) {
		into('/')
	}
	
	from('packaging/distribution') {
		include 'Jangbogo.bat', 'install.bat', 'uninstall.bat', 'Restart-Tray.bat',
			'Jangbogo-Tray.ps1', 'create-shortcuts.ps1', 'download-jre.ps1', 'download-winsw.ps1',
			'설치가이드.txt', '사용설명서.txt', '고급가이드.txt', 'README.md'
		into('/')
	}
	
	from("${buildDir}/jre") {
		into('jre')
	}

	// 라이선스 고지 (AGPL-3.0 제4조: 사본과 함께 라이선스 전문을 전달해야 한다).
	// 이 세 파일이 빠진 채로 여러 버전이 배포됐다 — NOTICE 자신이 "배포 시 LICENSE 와 함께
	// 포함하라"고 적어 둔 것을 정작 packageDist 가 지키지 않고 있었다.
	from(projectDir) {
		include 'LICENSE', 'NOTICE'
		into('/')
	}
	from("${buildDir}/generated") {
		include 'CORRESPONDING-SOURCE.txt'
		into('/')
	}
	
	from('packaging/winsw') {
		include '*.exe', '*.md'
		into('service')
	}

	// WinSW 서비스 정의(XML)는 JAR 파일명을 참조한다. 저장소의 원본에는 버전을 적지 않고
	// @JAR_NAME@ 토큰만 두며, 여기서 bootJar 가 실제로 만든 파일명으로 치환한다.
	// 버전의 단일 출처는 위 version 선언 하나뿐이다. (Phase 3-8)
	from('packaging/winsw') {
		include 'jangbogo-service.xml'
		filter(org.apache.tools.ant.filters.ReplaceTokens,
			tokens: ['JAR_NAME': bootJar.archiveFileName.get()])
		into('service')
	}
	
	// 산출물 자체를 검사한다 — 선언이 안전해 보이는 것과 결과물이 안전한 것은 다른 사실이다.
	//
	// 위 from(...) 들은 담을 대상을 파일명으로 열거하므로 "결과적으로" 안전하다 (v0.18.1 실측: 릴리스
	// ZIP 300 개 엔트리에 db·exports·logs·config 가 하나도 없다). 그런데 누가 편의를 위해
	// from(projectDir) 같은 넓은 지정을 하나 더 붙이는 순간 조용히 샌다. 이 저장소도 배포물도 PUBLIC 이고,
	// 이 프로그램이 다루는 것은 프로그램을 실행하는 사람의 개인 구매 내역이다 — 공공 데이터가 아니다.
	// 한 번 배포되면 회수할 수 없다. 그래서 선언을 믿지 않고 방금 만든 ZIP 을 직접 연다.
	//
	// 엔트리 '이름' 만 훑고 내용은 읽지 않는다. ZipFile 은 중앙 디렉터리만 읽으므로 100MB 짜리 배포
	// ZIP 이어도 릴리스 빌드가 느려지지 않는다.
	doLast {
		def forbiddenSuffixes = ['.db', '.db-wal', '.db-shm', '.sqlite', '.sqlite3']
		def forbiddenPrefixes = ['db/', 'logs/', 'exports/']
		// 값이 든 실제 파일만 막는다. .example 은 값이 없는 설정 서식이라 담겨도 된다 —
		// 오히려 배포본에서 사용자가 설정을 만들 때 필요하다.
		def forbiddenNames = ['mall_account.yml', 'admin.properties']

		def zipFile = archiveFile.get().asFile
		def offenders = []
		def checked = 0
		def zip = new java.util.zip.ZipFile(zipFile)
		try {
			def entries = zip.entries()
			while (entries.hasMoreElements()) {
				// 구분자: ZIP 규격은 '/' 지만 '\' 로 쓰는 도구가 있어 맞춰 둔다.
				// 대소문자: 낮춰서 비교한다. 개발 PC 가 Windows 라 .DB 와 .db 는 같은 파일인데,
				// 여기서 대소문자를 따지면 대문자로 남은 것만 조용히 빠져나간다.
				def name = entries.nextElement().name.replace('\\', '/')
				def lower = name.toLowerCase(Locale.ROOT)
				def leaf = lower.substring(lower.lastIndexOf('/') + 1)
				checked++
				if (forbiddenPrefixes.any { lower.startsWith(it) }
						|| forbiddenSuffixes.any { leaf.endsWith(it) }
						|| forbiddenNames.contains(leaf)) {
					offenders << name
				}
			}
		} finally {
			zip.close()
		}

		if (!offenders.isEmpty()) {
			offenders.sort()
			throw new GradleException(
				"배포 ZIP 에 개인 데이터로 읽히는 항목이 실렸다: ${zipFile}\n  "
					+ offenders.join("\n  ")
					+ "\n\n이 저장소도 배포물도 PUBLIC 이고, 이 프로그램이 다루는 것은 프로그램을 실행하는 사람의"
					+ " 개인 구매 내역이다.\n위 항목이 실리면 개발자 개인의 구매 내역·수집 로그·쇼핑몰 계정이 그대로"
					+ " 공개되고, 한 번 나가면 회수할 수 없다.\npackageDist 에 from(projectDir) 같은 넓은 지정이"
					+ " 추가되지 않았는지 확인해라. 담을 대상은 파일명을 하나씩 열거해야 한다.")
		}
		println "✓ 산출물 검사 통과: 개인 데이터 엔트리 없음 (엔트리 ${checked} 개 확인)"
	}

	doLast {
		println "✅ 배포 패키지 생성 완료!"
		println "📦 파일 위치: ${archiveFile.get().asFile}"
		println ""
		println "📌 이 패키지는 Java 설치 없이 실행 가능합니다."
		println ""
		println "배포 방법:"
		println "1. ZIP 파일을 원하는 위치에 압축 해제"
		println "2. Jangbogo.bat 실행 (일반 실행)"
		println "3. service 폴더의 README.md 참조 (Windows 서비스 등록)"
	}
}

