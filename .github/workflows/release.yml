name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      shell: bash
      
    - name: Build Distribution Package
      run: .\gradlew clean bootJar createJre packageDist --no-daemon
      
    - name: Rename distribution file
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"
        Copy-Item "build\distributions\Jangbogo-distribution.zip" "Jangbogo-v$version.zip"
      shell: pwsh
      
    # 유일한 서드파티 액션이라 버전을 방치하면 위험이 가장 크다(v1 은 Node 16 런타임까지
    # 거슬러 올라간다). v3 은 Node 24 기준이다.
    # 토큰을 env(GITHUB_TOKEN)로 넘기는 방식은 fallback 으로만 남고 deprecated 됐다.
    # 지금은 둘 다 동작하지만 env 만 두면 다음 메이저에서 조용히 끊길 자리라 입력으로 옮겼다.
    # 위 permissions: contents: write 가 이 스텝 때문에 필요하다 — 빼면 릴리스 생성이 403 난다.
    # body_path 가 가리키는 릴리스 노트 파일이 태그 커밋에 없으면 이 스텝에서 실패한다.
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: Jangbogo-v*.zip
        body_path: release/RELEASE_NOTES_v${{ steps.get_version.outputs.VERSION }}.md
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}

    # 여기에 "Upload artifacts" 스텝이 있었다. 같은 zip 을 Release 자산으로 올린 **직후** 한 번 더
    # 액션 아티팩트로 올리던 것이라, 릴리스마다 102MB 가 90일씩 그대로 중복돼 쌓였다.
    #
    # 지워도 잃는 것이 없다는 것은 실측으로 확인했다 — v0.7.0·v0.8.0·v0.10.2·v0.18.1·v0.22.0
    # 다섯 벌(509MB)이 아티팩트로 남아 있었고, 그 전부가 위 Create Release 가 올린
    # Jangbogo-v<버전>.zip 으로 Release 페이지에 그대로 있었다. 받는 곳이 Release 이지
    # 아티팩트 목록이 아니므로 이 스텝은 처음부터 아무도 쓰지 않는 사본이었다.
    #
    # 아티팩트는 저장 quota 를 계정 단위(500MB)로 먹고 Release 자산은 먹지 않는다. 다시 넣지 마라.
    # WorkflowArtifactHygieneTest 가 이 워크플로에 upload-artifact 가 되돌아오는 것을 감시한다.

