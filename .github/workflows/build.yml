name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash
      
    - name: Build with Gradle
      run: .\gradlew clean build --no-daemon

    - name: Run tests
      run: .\gradlew test --no-daemon

    # 배포 패키지까지 여기서 만들어 본다.
    #
    # 왜 필요한가: createJre·packageDist 는 release.yml 에서만 돌았다. 그래서 그 경로가
    # 깨져도 태그를 밀기 전까지 아무도 모른다 — 실제로 그렇게 됐다. 래퍼를 8.14.3 → 9.6.1
    # 로 올린 커밋(ac46e85)이 createJre 의 exec { } 를 죽였는데(Gradle 9 에서 Project.exec()
    # 제거), 두 판이 지나도록 CI 는 계속 초록이었고 v0.22.0 태그를 밀고 나서야 터졌다.
    #
    # 태그를 미는 순간은 되돌리기가 가장 비싼 시점이다(태그 삭제·재생성). 그 전에
    # 매 푸시에서 같은 명령을 밟아 둔다.
    - name: Build distribution package (release path)
      run: .\gradlew bootJar createJre packageDist --no-daemon
      
    # upload-artifact 는 v4 부터 한 워크플로 실행 안에서 같은 name 으로 두 번 올리면
    # 덮어쓰기가 아니라 그대로 실패한다(아티팩트가 불변이 됐다). 아래 두 스텝의 name 이
    # 서로 다른 것은 우연이 아니라 이 제약 때문이며, 새 업로드 스텝을 추가할 때도
    # name 을 반드시 다르게 잡아야 한다.
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: jangbogo-jar
        path: build/libs/*.jar
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: build/test-results/
        retention-days: 7

